name: Project04 Stage3 Feature Engineering

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Stage 2 artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: stage2-raster-preprocessing.yml
          name: project04-stage2-seasonal-composites
          path: stage2_artifact
          workflow_conclusion: success
          branch: main

      - name: Restore Stage 2 processed rasters
        run: |
          mkdir -p data/processed
          cp -r stage2_artifact/data/processed/. data/processed/

      - name: Run Stage 3
        run: |
          python src/run_stage3.py

      - name: Show Stage 3 report
        run: |
          cat outputs/STAGE3_REPORT.md

      - name: Upload complete Stage 3 artifact
        uses: actions/upload-artifact@v5
        with:
          name: project04-stage3-feature-stack
          path: |
            outputs/
            data/processed/

      - name: Commit lightweight Stage 3 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Generate Project04 Stage 3 feature outputs"
            git push
          fi
