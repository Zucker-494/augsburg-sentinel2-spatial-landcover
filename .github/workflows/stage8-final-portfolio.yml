name: Project04 Stage8 Final Portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage8:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Stage 7 artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: stage7-interpretation.yml
          name: project04-stage7-interpretation
          path: stage7_artifact
          workflow_conclusion: success
          branch: main

      - name: Restore final rasters and outputs
        run: |
          mkdir -p data/processed outputs
          cp stage7_artifact/data/processed/final_hgb_classification.tif data/processed/
          cp stage7_artifact/data/processed/final_hgb_confidence.tif data/processed/
          cp -r stage7_artifact/outputs/. outputs/

      - name: Run Stage 8
        run: |
          python src/run_stage8.py

      - name: Show final report
        run: |
          cat outputs/FINAL_REPORT.md

      - name: Upload final Project04 artifact
        uses: actions/upload-artifact@v5
        with:
          name: project04-final-portfolio
          path: |
            outputs/
            docs/
            README.md
            PROJECT_STATUS.md
            data/processed/final_hgb_classification.tif
            data/processed/final_hgb_confidence.tif

      - name: Commit final lightweight portfolio outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ docs/ README.md PROJECT_STATUS.md
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Finalize Project04 portfolio outputs"
            git push
          fi
